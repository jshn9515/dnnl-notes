[project]
name = "dnnl-notes"
version = "2026.11.01.dev0"
keywords = [
    "deep learning",
    "computer vision",
    "natural language processing",
    "large language models",
]
description = "A collection of notes and code examples for deep learning concepts and techniques."
authors = [{ name = "jshn9515", email = "jshn9510@gmail.com" }]
readme = "README.md"
license = "CC-BY-NC-4.0"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # PyTorch ecosystem
    "torch[opt-einsum,pyyaml]>=2.15.0,<2.16.0",
    "torchaudio>=2.11.0,<2.12.0",
    "torchvision[gdown,scipy]>=0.29.0,<0.30.0",
    "torchinfo>=1.8.0,<1.9.0",
    "torchmetrics>=1.9.0,<1.10.0",

    # Hugging Face ecosystem
    "accelerate>=1.15.0,<1.16.0",
    "datasets[audio,torch,vision]>=5.1.0,<5.2.0",
    "diffusers[torch]>=0.42.0,<0.43.0",
    "kernels[torch]>=0.18.1,<0.19.0",
    "tokenizers>=0.23.0,<0.24.0",
    "transformers[torch,vision,kernels]>=5.22.0,<5.23.0",

    # LLM
    "openai[aiohttp,datalib]>=3.30.0,<4.0.0",

    # High performance kernels
    "triton>=3.9.0,<3.10.0; sys_platform == 'linux'",
    "xformers==0.0.35",

    # Scientific computing and machine learning
    "numpy>=2.5.0,<2.6.0",
    "scipy>=1.18.0,<1.19.0",

    # Data processing and visualization
    "pandas[plot]>=3.1.0,<3.2.0",
    "pillow>=13.0.0,<13.1.0",
    "matplotlib>=3.11.0,<3.12.0",

    # Jupyter and interactive development
    "ipython[matplotlib]>=9.15.0",
    "ipywidgets>=8.1.0",
    "jupyter-cache>=1.0.0",
    "jupyterlab>=4.5.0",

    # DNNL utilities
    "dnnlpy[rl]>=2026.10.2"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.7.0,<4.8.0",
    "ruff>=0.17.0,<0.18.0",
    "ty==0.0.99",
]

[project.urls]
Homepage = "https://github.com/jshn9515/dnnl-notes"
Repository = "https://github.com/jshn9515/dnnl-notes.git"
Documentation = "https://jshn9515.github.io/dnnl-notes/"

[tool.uv]
torch-backend = "cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
dnnlpy = { path = "./dnnlpy" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
