project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  post-render:
    - "utils/clean_checkpoints.py"
    - "utils/clean_quarto_cache.py"
    - "utils/html_generate_toc.py"

execute:
  jupyter: python3
  freeze: auto
  cache: true

format:
  html:
    theme:
      - cosmo
      - brand
    grid:
      sidebar-width: 250px
      body-width: 850px
      margin-width: 250px
    css: styles.css
    toc: true
    syntax-highlighting: github
    code-annotations: hover
    license: CC BY-NC

website:
  title: dnnl-notes
  search: true
  back-to-top-navigation: false
  page-navigation: true
  repo-url: https://github.com/jshn9515/dnnl-notes
  repo-actions: [source, issue, edit]
  open-graph:
    locale: en_US
    site-name: dnnl-notes
  comments:
    giscus:
      repo: jshn9515/dnnl-notes
      repo-id: R_kgDOVlbPuw
      category: Announcements
      category-id: DIC_kwDOVlbPu84DKiYL
      mapping: og:title
      loading: lazy
      input-position: top
      language: en
  navbar:
    right:
      - text: 中文
        href: zh/
      - text: English
        href: en/
  sidebar:
    - id: zh
      style: floating
      collapse-level: 1
      contents:
        - section: "Part 1: 深度学习基础"
          contents:
            - section: "Chapter 1: 深度学习简介"
              contents: "zh/ch1-introduction/*.qmd"
    - id: en
      style: floating
      collapse-level: 1
      contents:
        - section: "Part 1: Deep Learning Fundamentals"
          contents:
            - section: "Chapter 1: Introduction to Deep Learning"
              contents: "en/ch1-introduction/*.qmd"
